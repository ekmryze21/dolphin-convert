name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: |
          dnf -y install "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf -y install ffmpeg ImageMagick poppler-utils ghostscript file procps-ng util-linux python3
      - uses: actions/checkout@v4
      - run: for f in dolphin-convert install.sh test.sh lang/*.sh; do bash -n "$f" || exit 1; done; python3 -m py_compile ui.py
      - run: ./test.sh
